# Enable only after certificate provisioning; restrict staging access at firewall/VPN.
server { listen 80; server_name staging.example.com; include /etc/nginx/snippets/letsencrypt.conf; location / { return 308 https://staging.example.com$request_uri; } }
server {
 listen 443 ssl;
 http2 on;
 server_name staging.example.com;
 ssl_certificate /etc/letsencrypt/live/staging.example.com/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/staging.example.com/privkey.pem;
 include /etc/nginx/snippets/ssl/tls.conf;
 include /etc/nginx/snippets/security/headers.conf;
 location / { return 403; }
}
