# Example frontend; do not enable until app.example.com certificate exists.
server { listen 80; server_name app.example.com; include /etc/nginx/snippets/letsencrypt.conf; location / { return 308 https://app.example.com$request_uri; } }
server {
 listen 443 ssl;
 http2 on;
 server_name app.example.com;
 ssl_certificate /etc/letsencrypt/live/app.example.com/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;
 include /etc/nginx/snippets/ssl/tls.conf;
 include /etc/nginx/snippets/security/headers.conf;
 add_header Strict-Transport-Security "max-age=31536000" always;
 root /var/www/app;
 index index.html;
 location / { try_files $uri $uri/ /index.html; }
 location ~* \.(?:css|js|png|jpg|jpeg|svg|webp|woff2)$ { include /etc/nginx/snippets/cache/static.conf; try_files $uri =404; }
}
