# ACTIVE ONLY AFTER TLS CERTIFICATE IS PROVISIONED.
server {
 listen 80;
 server_name api.example.com;
 include /etc/nginx/snippets/letsencrypt.conf;
 location / { 
    return 308 https://api.example.com$request_uri; 
 }
}

server {
 listen 443 ssl;
 http2 on;
 server_name api.example.com;
 ssl_certificate /etc/letsencrypt/live/api.example.com/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
 include /etc/nginx/snippets/ssl/tls.conf;
 include /etc/nginx/snippets/security/headers.conf;
 add_header Strict-Transport-Security "max-age=31536000" always;
 access_log /var/log/nginx/api.access.log gateway;
 error_log /var/log/nginx/api.error.log warn;
 client_max_body_size 10m;
 
 location = /healthz { 
    access_log off; 
    return 200 "ok\n"; 
    add_header Content-Type text/plain; 
 }
 
 location /auth/ {
  limit_req zone=auth_per_ip burst=5 nodelay;
  limit_conn connections_per_ip 10;
  include /etc/nginx/snippets/proxy/common.conf;
  include /etc/nginx/snippets/proxy/timeouts.conf;
  proxy_pass http://auth_service;
 }

 location /users/ {
  include /etc/nginx/snippets/security/rate-limit.conf;
  include /etc/nginx/snippets/proxy/common.conf;
  include /etc/nginx/snippets/proxy/timeouts.conf;
  proxy_pass http://user_service;
 }

 location /payments/ {
  limit_req zone=payments_per_ip burst=10 nodelay;
  limit_conn connections_per_ip 20;
  include /etc/nginx/snippets/proxy/common.conf;
  include /etc/nginx/snippets/proxy/timeouts.conf;
  proxy_pass http://payment_service;
 }

 location /notifications/ws/ {
  limit_conn connections_per_ip 10;
  include /etc/nginx/snippets/proxy/websocket.conf;
  proxy_pass http://notification_service;
 }

 location / { 
    return 404; 
 }
}
