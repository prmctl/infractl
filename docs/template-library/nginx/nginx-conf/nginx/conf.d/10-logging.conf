log_format gateway escape=json '{"time":"$time_iso8601","remote_addr":"$remote_addr","request_id":"$request_id","host":"$host","method":"$request_method","uri":"$uri","status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,"upstream_time":"$upstream_response_time","upstream_status":"$upstream_status","upstream_addr":"$upstream_addr"}';
access_log /var/log/nginx/access.log gateway buffer=64k flush=5s;
error_log /var/log/nginx/error.log warn;
