site_name: infractl
site_url: https://infractl.prmctl.me/
site_description: Infrastructure notes and references
repo_url: https://github.com/prmctl/infractl
repo_name: prmctl/infractl
docs_dir: docs
site_dir: site
use_directory_urls: true
theme:
  name: material
  language: en
  features:
    - navigation.indexes
    - navigation.path
    - search.highlight
    - content.code.copy
  palette:
    scheme: slate
  font: false
extra_css:
  - stylesheets/compact.css
markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
plugins:
  - search
# No nav: MkDocs discovers new nested folders and Markdown pages automatically.
