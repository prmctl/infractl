site_name: infractl
site_description: Infrastructure notes, labs and commands
site_url: ""
docs_dir: docs
site_dir: _site
theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: blue grey
      accent: blue grey
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - scheme: slate
      primary: blue grey
      accent: blue grey
      toggle:
        icon: material/brightness-4
        name: Light mode
  features:
    - navigation.sections
    - navigation.indexes
    - search.highlight
    - content.code.copy
  font: false
plugins:
  - search
markdown_extensions:
  - admonition
  - tables
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - toc:
      permalink: true
